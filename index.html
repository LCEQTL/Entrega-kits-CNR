<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrega de Kits CNR · Carteiras PI</title>
<style>

:root{
  --navy:#0b2e59; --navy2:#14427d; --ink:#1d2433; --mute:#667085; --line:#e4e7ec; --bg:#f4f6f9; --card:#fff;
  --g:#3ccf91; --y:#e3d23a; --r:#ef6236; --fe:#6b4de6; --blue:#2e6bd6;
  --rad:12px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
/* ---- login ---- */
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0b2e59,#1c5aa6)}
#login form{background:#fff;padding:32px 28px;border-radius:16px;width:min(360px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.25)}
#login h1{margin:0 0 4px;font-size:20px;color:var(--navy)}
#login p{margin:0 0 18px;color:var(--mute);font-size:13px}
#login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;font-size:15px}
#login button{width:100%;padding:11px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:600}
#login .err{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}
/* ---- header ---- */
header{background:var(--navy);color:#fff;padding:14px 22px 0;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.75}
header .meta{font-size:12px;opacity:.85;text-align:right}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav button{background:transparent;border:0;color:#cfe0ff;padding:9px 16px;border-radius:10px 10px 0 0;font-weight:600;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--navy)}
main{padding:18px 22px 60px;max-width:1500px;margin:0 auto}
/* ---- cards / kpis ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--rad);padding:12px 14px;box-shadow:var(--sh);border-left:4px solid var(--navy)}
.kpi b{display:block;font-size:12px;color:var(--navy)}
.kpi .v{font-size:28px;font-weight:700;color:var(--navy);line-height:1.15}
.kpi small{color:var(--mute);font-size:12px}
.panel{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:15px;color:var(--navy)}
.panel h3 small{font-weight:400;color:var(--mute);font-size:12px;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
/* ---- carteiras ---- */
.carts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.cart{background:var(--card);border:2px solid transparent;border-radius:var(--rad);padding:11px 13px;box-shadow:var(--sh);text-align:left;transition:.15s}
.cart:hover{border-color:#c9d6ea}
.cart.on{border-color:var(--navy);background:#f3f7ff}
.cart .nm{font-weight:700;color:var(--navy);font-size:14px;display:flex;justify-content:space-between;gap:6px}
.cart .ow{font-size:11.5px;color:var(--mute);margin:2px 0 7px;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart .foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:6px}
.sla{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eef1f5}
.sla i{display:block;height:100%}
.c1{background:var(--g)}.c2{background:var(--y)}.c3{background:var(--r)}.cF{background:var(--fe)}
/* ---- visão geral ---- */
.ov{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:1000px){.ov{grid-template-columns:1fr}}
.ov .panel{margin:0}
.ovall{cursor:pointer;border:2px solid transparent;transition:.15s}
.ovall:hover{border-color:#c9d6ea}.ovall.on{border-color:var(--navy);background:#f6f9ff}
.ovall .big{display:flex;align-items:baseline;gap:10px;margin:2px 0 10px}
.ovall .big b{font-size:40px;color:var(--navy);line-height:1}
.ovall .big span{color:var(--mute)}
.ovall .track{height:28px;font-size:12.5px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.minis div{background:#f6f8fb;border-radius:9px;padding:7px 10px;font-size:11.5px;color:var(--mute);cursor:pointer;border:1px solid transparent}
.minis div:hover{border-color:#c9d6ea}
.minis div.on{border-color:var(--navy);background:#eef4ff}
.minis b{display:block;font-size:18px;color:var(--navy)}
.crow{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;padding:6px 8px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.crow:hover{background:#f6f8fb}
.crow.on{background:#eef4ff;border-color:var(--navy)}
.crow .nm{font-weight:700;color:var(--navy);font-size:13px;line-height:1.2}
.crow .nm small{display:block;font-weight:400;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .tot{font-weight:700;color:var(--navy);text-align:right}
.track{display:flex;height:20px;border-radius:5px;overflow:hidden;background:#f1f3f6}
.track i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-style:normal;font-weight:700;min-width:0;overflow:hidden}
.track i.c2{color:#3b3a10}
/* ---- filtros ---- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);padding:10px 12px;border-radius:var(--rad);box-shadow:var(--sh);margin-bottom:14px;position:sticky;top:var(--hh,100px);z-index:10}
.filters input[type=search]{flex:1 1 240px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;min-width:180px}
.chip{border:1px solid var(--line);background:#fff;padding:5px 11px;border-radius:999px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.btn{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:9px;font-size:12.5px}
.btn:hover{background:#f2f4f7}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navy2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.count{color:var(--mute);font-size:12.5px;margin-left:auto}
/* ---- árvore ---- */
details.l1{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
details.l1>summary{list-style:none;padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;color:var(--navy);font-size:15px;border-bottom:1px solid transparent}
details.l1[open]>summary{border-bottom-color:var(--line)}
details.l1.fe>summary{background:linear-gradient(90deg,#efeaff,#fff);color:#4a2fc2}
details.l1.dup>summary{background:linear-gradient(90deg,#fff3e0,#fff);color:#a35200}
.tag.dup{background:#fff3e0;color:#a35200;font-weight:700}
.by{font-size:11.5px;color:#067647;font-weight:600}
#saveSt{font-size:11.5px;opacity:.85;margin-right:10px}
#who{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:4px 8px;width:130px;font-size:12px}
#who::placeholder{color:#cfe0ff}
summary::-webkit-details-marker{display:none}
summary .car{transition:transform .15s;display:inline-block;width:12px;color:var(--mute)}
details[open]>summary .car{transform:rotate(90deg)}
summary .n{background:#eef2f8;color:var(--navy);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
summary .sumbar{margin-left:auto;display:flex;align-items:center;gap:10px}
summary .sumbar .track{width:min(340px,32vw);height:22px}
summary .sumbar .tt{font-weight:800;color:var(--navy);min-width:34px;text-align:right;font-size:15px}
.l1body{padding:6px 10px 10px}
details.l2{border-bottom:1px solid #f0f2f5}
details.l2:last-child{border-bottom:0}
details.l2>summary{list-style:none;padding:9px 8px;display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13.5px}
details.l2>summary:hover{background:#f8fafc}
details.l2>summary .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mini{font-size:11.5px;color:var(--mute);white-space:nowrap}
.tasks{padding:4px 8px 12px 30px;display:grid;gap:8px}
.task{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fcfdff;display:grid;grid-template-columns:auto 1fr;gap:10px}
.task.done{opacity:.55}
.task .chk{padding-top:2px}
.task .chk input{width:17px;height:17px;accent-color:var(--navy)}
.trow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px}
.nota{font-family:ui-monospace,Consolas,monospace;font-weight:700;background:var(--navy);color:#fff;border-radius:6px;padding:2px 8px;border:0;font-size:12.5px}
.nota:hover{background:var(--navy2)}
.tag{background:#eef2f8;color:#344054;border-radius:6px;padding:1px 7px;font-size:12px}
.tag.cart-t{background:#e6efff;color:#1b4fa8;font-weight:600}
.tag.st{background:#fff4e5;color:#a15c00}
.tag.hi{background:#fde8e8;color:#b42318;font-weight:700}
.tag.fe{background:#efeaff;color:#4a2fc2;font-weight:700}
.dias{border-radius:6px;padding:1px 7px;font-weight:700;font-size:12px;color:#1d2433}
.desc{margin-top:7px;font-size:13px;white-space:pre-wrap;color:#344054;max-height:4.4em;overflow:hidden;position:relative}
.desc.open{max-height:none}
.more{border:0;background:none;color:var(--blue);font-size:12px;padding:2px 0}
.tsub{font-size:12px;color:var(--mute);margin-top:4px}
.empty{padding:40px;text-align:center;color:var(--mute)}
/* ---- gráficos ---- */
.bars .row{display:grid;grid-template-columns:170px 1fr 48px;gap:10px;align-items:center;margin:6px 0;font-size:12.5px}
.bars .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;color:#344054}
.bars .tot{font-weight:700;color:var(--navy)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:3px;font-size:12px}
.heat th{font-weight:600;color:var(--mute);padding:3px 6px;white-space:nowrap}
.heat th.rl{text-align:right;color:#344054;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.heat td{min-width:46px;height:32px;text-align:center;border-radius:6px;font-weight:700;cursor:pointer}
.heat td.z{cursor:default;color:#c0c6d0;font-weight:400}
.heat td:not(.z):hover{outline:2px solid var(--navy)}
.heat td.tt{background:#eef2f8!important;color:var(--navy)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:8px;vertical-align:middle}
.seg button{border:0;background:#fff;padding:4px 10px;font-size:12px}
.seg button.on{background:var(--navy);color:#fff}
svg text{font-family:inherit}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
table.tb th{color:var(--mute);font-weight:600;font-size:12px}
table.tb td.num,table.tb th.num{text-align:right}
.up{color:#b42318;font-weight:700}.down{color:#067647;font-weight:700}
.idlist{display:flex;flex-wrap:wrap;gap:5px;max-height:180px;overflow:auto}
/* ---- admin ---- */
.form label{display:block;font-size:12px;font-weight:600;color:#344054;margin:10px 0 4px}
.form input[type=text],.form input[type=password],.form input[type=date],.form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.form textarea{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.drop{border:2px dashed #b9c6db;border-radius:12px;padding:26px;text-align:center;color:var(--mute);background:#fafcff;cursor:pointer}
.drop.over{border-color:var(--navy);background:#eef4ff}
.log{background:#0f172a;color:#d1e2ff;border-radius:10px;padding:10px 12px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:220px;overflow:auto;margin-top:10px}
.note{font-size:12px;color:var(--mute)}
.warn{background:#fff7e6;border:1px solid #ffd591;color:#874d00;padding:8px 10px;border-radius:9px;font-size:12.5px;margin-top:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}

:root{--p1:#c0392b;--p2:#d4a80c;--p3:#1e9e4f;--p4:#8aa4c2}
.cP1{background:var(--p1)}.cP2{background:var(--p2)}.cP3{background:var(--p3)}.cP4{background:var(--p4)}
.track i.cP2{color:#3b3000}
.track i{white-space:nowrap}
.heat td{white-space:nowrap;padding:0 6px}
.modebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.modebtn{border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:800;padding:9px 22px;border-radius:10px;letter-spacing:.3px}
.modebtn.on{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(11,46,89,.3)}
.big small{display:block;font-size:13px;color:var(--mute);margin-top:4px}
.kit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fcfdff;display:grid;grid-template-columns:auto 1fr;gap:10px}
.kit.done{opacity:.55}
.kit .chk input{width:17px;height:17px;accent-color:var(--navy)}
.val{font-weight:800;color:var(--navy);font-size:14px}
.far{border-radius:6px;padding:1px 8px;font-weight:700;font-size:12px}
.far.late{background:#fde2dc;color:#a3240f}.far.ok{background:#d9f5e6;color:#0b6b3a}.far.soon{background:#fff1c2;color:#7a5b00}
.prtag{border-radius:6px;padding:1px 7px;font-weight:800;font-size:12px;color:#fff}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 14px;margin-top:8px;font-size:12px}
.fields div{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fields b{color:#344054;font-weight:600}
.cp{border:0;background:none;color:var(--blue);cursor:pointer;padding:0 2px;font-size:11px}
table.mx{border-collapse:separate;border-spacing:2px;font-size:12.5px;width:100%}
table.mx th{background:var(--navy);color:#fff;padding:7px 8px;font-weight:700;white-space:nowrap}
table.mx th.rl{text-align:left}
table.mx td{text-align:center;padding:7px 6px;border-radius:4px;background:#f3f5f8;cursor:pointer;font-weight:600}
table.mx td.z{background:#fafbfc;cursor:default;color:#c6ccd5}
table.mx td.t,table.mx th.t{background:#e9eef6;color:var(--navy);font-weight:800;cursor:default}
table.mx td:not(.z):not(.t):hover{outline:2px solid var(--navy)}
/* compacto */
.modebar{margin-bottom:10px}
.modebtn{padding:6px 16px;font-size:12.5px;border-width:1.5px;border-radius:8px}
.ov{gap:12px;margin-bottom:12px}
.ov .panel{padding:12px 14px}
.ov .panel h3{margin:0 0 6px;font-size:14px}
.ovall{border:1px solid transparent}
.ovall:hover{border-color:#d5deeb}
.ovall.on{border-color:#d5deeb;background:#fff}
.ovall .big{margin:0 0 6px;gap:8px}
.ovall .big b{font-size:28px}
.ovall .big span{font-size:12.5px}
.ovall .track{height:22px}
.ov .legend{margin-bottom:5px;gap:10px;font-size:11.5px}
.minis{grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.minis div{padding:5px 8px;font-size:10.5px;line-height:1.25;border:1px solid transparent}
.minis div.on{border-color:#9db4d8;background:#eef4ff}
.minis b{font-size:14.5px;white-space:nowrap}
.crow{grid-template-columns:140px 1fr auto;padding:3px 6px;border:1px solid transparent;gap:8px}
.crow .tot{min-width:88px;white-space:nowrap}
.crow .track{height:18px}
.crow.on{border-color:#9db4d8;background:#f0f5fd}
.crow .nm{font-size:12.5px}
@media(max-width:1200px){.minis{grid-template-columns:repeat(3,1fr)}}
.info{background:#f2f6fc;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#344054;margin-bottom:14px;line-height:1.55}
.info b{color:var(--navy)}
.localbadge{background:#ffd166;color:#4a3500;font-weight:800;border-radius:6px;padding:2px 8px;font-size:11px;margin-left:8px;vertical-align:middle}
</style>
</head>
<body>

<section id="login">
  <form id="loginForm" autocomplete="on">
    <h1>Entrega de Kits CNR</h1>
    <p>Dados criptografados. Informe a palavra-chave para abrir.</p>
    <input type="password" id="pw" placeholder="Palavra-chave" autocomplete="current-password" autofocus>
    <button type="submit" id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <div class="hrow">
      <div>
        <h1>Entrega de Kits CNR · Cobrança por Carteira<span id="localBadge"></span></h1>
        <div class="sub" id="hdrSub"></div>
      </div>
      <div class="meta" id="hdrMeta"></div>
    </div>
    <nav id="tabs">
      <button data-t="kits" class="on">Kits</button>
      <button data-t="analise">Análise</button>
      <button data-t="evolucao">Evolução</button>
      <button data-t="admin" id="tabAdmin">Admin</button>
      <span style="margin-left:auto;display:flex;align-items:center;gap:6px;padding-bottom:4px"><span id="saveSt"></span><input id="who" placeholder="Seu nome" title="Aparece nos kits que você marcar como cobrados"><button id="logout" style="background:transparent;border:0;color:#cfe0ff;font-weight:600;padding:6px 10px">Sair</button></span>
    </nav>
  </header>
  <main>
    <div class="modebar">
      <button class="modebtn" data-mode="v">VISÃO VALOR</button>
      <button class="modebtn" data-mode="q">VISÃO QUANTIDADE</button>
    </div>
    <section id="t-kits"></section>
    <section id="t-analise" class="hidden"></section>
    <section id="t-evolucao" class="hidden"></section>
    <section id="t-admin" class="hidden"></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== Núcleo: leitura da base de Kits CNR, normalização e criptografia =====
const CORE = (() => {
  const DEFAULT_CARTEIRAS = ['BOM JESUS', 'GA_FLORIAN', 'HIB_PICOS', 'S R NONATO', 'PPM_FLORIA'];
  const COLS = {
    n: 'Nota', cli: 'Clientes', pn: 'Parceiro Negócio', cc: 'Conta Contrato', ins: 'Instalação', uc: 'UC_ANEEL',
    ul: 'Unidade de Leitura', dist: 'Distrital', mun: 'Município', seg: 'Segmento', sega: 'Segmento Agrupado',
    cls: 'Classe Principal', c: 'Carteira Atual', c0: 'Carteira', val: 'R$ Valor', pecld: 'R$ PECLD Societária',
    dc: 'Data de Criação CNR', pz: 'Prazo de Entrega', far: 'Farol Prazo', stt: 'Status', strs: 'Status Resumido',
    aging: 'Aging de entrega', pr: 'PRIORIDADE', per: 'PERIMETRO', ii: 'INICIO_IRREGULARIDADE', fi: 'FIM_IRREGULARIDADE',
    nc: 'Nota de Cálculo', fat: 'Fatura', venc: 'Data Vencimento', ccs: 'Status CCS', ep: 'ENTRANTE_PASSIVO',
    alp: 'Alerta - Parceiro', reg: 'Regional', emp: 'Empresa', de: 'Data Entrega', desc: 'Descrição', ct: 'Centro de Trabalho'
  };
  const REQUIRED = ['n', 'cli', 'c', 'val', 'dc'];
  const FX_IDADE = [['a', '0 - 30', 30], ['b', '31 - 60', 60], ['c', '61 - 90', 90], ['d', '91 - 180', 180], ['e', '181 - 360', 360], ['f', 'Maior que 360', Infinity]];
  const FX_VALOR = [['a', '0 - 100', 100], ['b', '100 - 300', 300], ['c', '300 - 500', 500], ['d', '500 - 1.000', 1000], ['e', '1.000 - 2.000', 2000], ['f', '2.000 - 5.000', 5000], ['g', '5.000 - 10.000', 10000], ['h', 'Acima de 10.000', Infinity]];

  function toISO(v) {
    if (v === null || v === undefined || v === '') return '';
    if (v instanceof Date && !isNaN(v)) {
      const y = v.getFullYear(), m = v.getMonth() + 1, d = v.getDate();
      return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }
    if (typeof v === 'number') return new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10);
    const s = String(v).trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${m[1]}-${m[2]}-${m[3]}` : '';
  }
  const txt = v => (v === null || v === undefined) ? '' : String(typeof v === 'number' && Number.isInteger(v) ? v : v).replace(/_x000D_/g, '').trim();
  const num = v => { if (typeof v === 'number') return v; const s = String(v ?? '').replace(/[R$\s.]/g, '').replace(',', '.'); const n = parseFloat(s); return isNaN(n) ? 0 : n; };
  const days = (a, b) => (!a || !b) ? null : Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400000);
  const band = (list, v) => list.find(x => v <= x[2]) || list[list.length - 1];
  const prioPorIdade = d => d == null ? 'P4' : d <= 30 ? 'P4' : d <= 60 ? 'P3' : d <= 360 ? 'P2' : 'P1';

  function processRows(rows, carteiras, snapDate) {
    const set = new Set((carteiras && carteiras.length ? carteiras : DEFAULT_CARTEIRAS).map(x => x.trim().toUpperCase()));
    const out = [];
    for (const r of rows) {
      const o = {};
      for (const [k, col] of Object.entries(COLS)) o[k] = r[col];
      o.n = txt(o.n); if (!o.n || /^filtros/i.test(txt(o.emp))) continue;
      o.c = txt(o.c) || txt(o.c0);
      if (!set.has(o.c.toUpperCase())) continue;
      for (const k of ['dc', 'pz', 'ii', 'fi', 'venc', 'de']) o[k] = toISO(o[k]);
      for (const k of ['cli', 'pn', 'cc', 'ins', 'uc', 'ul', 'dist', 'mun', 'seg', 'sega', 'cls', 'c0', 'stt', 'strs', 'aging', 'pr', 'per', 'nc', 'fat', 'ccs', 'ep', 'alp', 'reg', 'emp', 'desc', 'ct']) o[k] = txt(o[k]);
      o.val = num(o.val); o.pecld = num(o.pecld);
      o.idade = days(o.dc, snapDate);
      o.far = (o.far === '' || o.far == null || isNaN(+o.far)) ? (o.idade == null ? null : 30 - o.idade) : Math.round(+o.far);
      o.pr = (o.pr || prioPorIdade(o.idade)).toUpperCase();
      o.fi_ = band(FX_IDADE, o.idade ?? 0)[0];
      o.fv = band(FX_VALOR, o.val)[0];
      o.atraso = o.far != null && o.far < 0;
      delete o.c0;
      out.push(o);
    }
    // nº de CNRs do mesmo cliente (parceiro) dentro do recorte
    const cnt = {}; out.forEach(o => { const k = o.pn || o.cli; cnt[k] = (cnt[k] || 0) + 1; }); out.forEach(o => o.ncli = cnt[o.pn || o.cli]);
    return out;
  }

  function sheetToRows(XLSX, arrayBuffer) {
    const wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: false }); // datas chegam como número serial (cellDates confunde o formato R$ com data)
    const name = wb.SheetNames.find(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, range: 0 })[0]?.includes('Nota')) || wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '', raw: true });
    const missing = REQUIRED.map(k => COLS[k]).filter(c => rows.length && !(c in rows[0]));
    // data da base: coluna "Data Entrega" (data de extração) quando é única
    const de = [...new Set(rows.map(r => toISO(r[COLS.de])).filter(Boolean))];
    return { rows, missing, sheet: name, dataBase: de.length === 1 ? de[0] : '' };
  }
  function guessDateFromName(fname, year) {
    const m = String(fname).match(/(\d{1,2})[-_.](\d{1,2})(?:[-_.](\d{2,4}))?/);
    if (!m) return '';
    let y = m[3] ? +m[3] : year; if (y < 100) y += 2000;
    return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  }
  // histórico compacto: [nota, carteira, idade, prioridade, valor, atraso(0/1)]
  function historyEntry(rows, date, file) {
    return { date, file, total: rows.length, valor: rows.reduce((s, o) => s + o.val, 0), items: rows.map(o => [o.n, o.c, o.idade, o.pr, Math.round(o.val * 100) / 100, o.atraso ? 1 : 0]) };
  }

  // ---- Criptografia (AES-GCM 256 + PBKDF2-SHA256) ----
  const ITER = 250000;
  const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function key(pass, salt, c) {
    const base = await c.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return c.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function encrypt(obj, pass, crypto_) {
    const c = crypto_ || crypto;
    const salt = c.getRandomValues(new Uint8Array(16)), iv = c.getRandomValues(new Uint8Array(12));
    const ct = await c.subtle.encrypt({ name: 'AES-GCM', iv }, await key(pass, salt, c), new TextEncoder().encode(JSON.stringify(obj)));
    return JSON.stringify({ v: 1, it: ITER, salt: b64(salt), iv: b64(iv), ct: b64(ct) });
  }
  async function decrypt(t, pass, crypto_) {
    const c = crypto_ || crypto, e = JSON.parse(t);
    const pt = await c.subtle.decrypt({ name: 'AES-GCM', iv: unb64(e.iv) }, await key(pass, unb64(e.salt), c), unb64(e.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  const utf8b64 = str => b64(new TextEncoder().encode(str));

  return { DEFAULT_CARTEIRAS, COLS, FX_IDADE, FX_VALOR, processRows, sheetToRows, guessDateFromName, historyEntry, encrypt, decrypt, utf8b64, days };
})();
if (typeof module !== 'undefined') module.exports = CORE;

</script>

<script>
// ======================= estado / utilitários =======================
const LOCAL = typeof LOCAL_DB !== 'undefined' ? LOCAL_DB : null;
const DB_PATH = 'data/db.enc', MARKS_PATH = 'data/marks.enc';
const S = { pass: null, db: null, rows: [], mode: 'q', grp: 'pr', f: { cart: 'ALL', pr: new Set(), q: '', st: '', seg: '', mun: '', hideDone: false, cell: null, mini: '' } };
const PR = [['P1', 'P1 · mais de 360 dias'], ['P2', 'P2 · 61 a 360 dias'], ['P3', 'P3 · 31 a 60 dias'], ['P4', 'P4 · até 30 dias']];
const PRC = { P1: 'var(--p1)', P2: 'var(--p2)', P3: 'var(--p3)', P4: 'var(--p4)' };
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brDate = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '—';
const mesLbl = ym => MESES[+ym.slice(5, 7) - 1] + '/' + ym.slice(2, 4);
const brl = v => 'R$ ' + (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brlK = v => v >= 1e6 ? 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : v >= 1e3 ? 'R$ ' + (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : 'R$ ' + Math.round(v);
const metric = l => S.mode === 'v' ? l.reduce((s, o) => s + o.val, 0) : l.length;
const fmt = v => S.mode === 'v' ? brlK(v) : String(v);
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2000); };
function groupBy(list, fn) { const m = new Map(); for (const o of list) { const k = fn(o); if (!m.has(k)) m.set(k, []); m.get(k).push(o); } return m; }
const cliKey = o => o.pn || o.cli;
function owners(c) { return ((S.db.config.donos || {})[c]) || ''; }
function farTag(o) {
  if (o.far == null) return '';
  if (o.far < 0) return `<span class="far late">atrasado ${(-o.far).toLocaleString('pt-BR')} dias</span>`;
  return `<span class="far ${o.far <= 7 ? 'soon' : 'ok'}">faltam ${o.far} dias</span>`;
}
const prTag = p => `<span class="prtag c${esc(p)}">${esc(p)}</span>`;

// ======================= marcações de cobrança (compartilhadas) =======================
const who = () => { try { return localStorage.getItem('who') || ''; } catch (e) { return ''; } };
const st = m => { const e = $('#saveSt'); if (e) e.textContent = m; };
const M = {
  data: {}, pend: new Map(), timer: null, busy: false,
  has(k) { return !!this.data[k]; }, get(k) { return this.data[k]; },
  localKey: 'kits_marks_local',
  set(k, v) {
    if (v) this.data[k] = { by: who() || 'anônimo', at: new Date().toISOString() }; else delete this.data[k];
    if (LOCAL) { try { localStorage.setItem(this.localKey, JSON.stringify(this.data)); } catch (e) {} st('salvo neste navegador'); return; }
    this.pend.set(k, this.data[k] || null); st('salvando…'); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1200);
  },
  async load() {
    if (LOCAL) { try { this.data = JSON.parse(localStorage.getItem(this.localKey) || '{}'); } catch (e) {} paintMarks(); return; }
    try {
      let raw = null;
      if (GH.token) { const cur = await GH.read(MARKS_PATH); raw = cur && cur.raw; }
      else { const r = await fetch(MARKS_PATH + '?v=' + Date.now(), { cache: 'no-store' }); if (r.ok) raw = await r.text(); }
      const remote = raw ? (await CORE.decrypt(raw, S.pass)).marks || {} : {};
      for (const [k, v] of this.pend) v ? remote[k] = v : delete remote[k];
      this.data = remote; paintMarks();
    } catch (e) { console.warn('marks', e); }
  },
  async flush() {
    if (!this.pend.size || this.busy) return;
    if (!GH.token) { st('sem token: não salvou'); toast('Sem token do GitHub configurado no Admin: a marcação não foi gravada.'); return; }
    this.busy = true; const ops = new Map(this.pend); this.pend.clear();
    for (let t = 0; t < 5; t++) {
      try {
        const cur = await GH.read(MARKS_PATH);
        const remote = cur ? (await CORE.decrypt(cur.raw, S.pass)).marks || {} : {};
        for (const [k, v] of ops) v ? remote[k] = v : delete remote[k];
        await GH.write(MARKS_PATH, await CORE.encrypt({ marks: remote }, S.pass), cur && cur.sha, `Cobrança: ${ops.size} marcação(ões) por ${who() || 'anônimo'}`);
        for (const [k, v] of this.pend) v ? remote[k] = v : delete remote[k];
        this.data = remote; paintMarks(); st('✓ salvo ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
        this.busy = false; if (this.pend.size) this.flush(); return;
      } catch (e) {
        if ([409, 422].includes(e.status) && t < 4) { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); continue; }
        for (const [k, v] of ops) if (!this.pend.has(k)) this.pend.set(k, v);
        st('erro ao salvar'); toast('Erro ao salvar marcação: ' + e.message); break;
      }
    }
    this.busy = false;
  }
};
function markInfo(k) { const m = M.get(k); return m ? `✓ cobrado por ${esc(m.by)} em ${new Date(m.at).toLocaleDateString('pt-BR')}` : ''; }
function paintMarks() {
  document.querySelectorAll('.kit[data-k]').forEach(t => {
    const k = t.dataset.k, on = M.has(k);
    t.classList.toggle('done', on); t.querySelector('.chk input').checked = on; t.querySelector('.by').innerHTML = markInfo(k);
  });
}

// ======================= login =======================
function loadDB(db) {
  db.config = db.config || {}; db.history = db.history || [];
  S.db = db; S.rows = (db.latest && db.latest.rows) || [];
}
async function login(pass) {
  const r = await fetch(DB_PATH + '?v=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('Base não encontrada (' + r.status + ')');
  const db = await CORE.decrypt(await r.text(), pass);
  S.pass = pass; loadDB(db);
  try { sessionStorage.setItem('k', pass); } catch (e) {}
  start();
}
function start() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  M.load();
  if (!LOCAL) { clearInterval(S.poll); S.poll = setInterval(() => { if (!document.hidden && !M.pend.size) M.load(); }, 60000); }
  renderAll();
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); const b = $('#loginBtn'); b.disabled = true; b.textContent = 'Abrindo…'; $('#loginErr').textContent = '';
  try { await login($('#pw').value); }
  catch (err) { $('#loginErr').textContent = /decrypt|operation/i.test(err.name + err.message) ? 'Palavra-chave incorreta.' : err.message; }
  b.disabled = false; b.textContent = 'Entrar';
});
$('#who').value = who();
$('#who').onchange = e => { try { localStorage.setItem('who', e.target.value.trim()); } catch (x) {} toast('Nome salvo'); };
$('#logout').onclick = () => { try { sessionStorage.removeItem('k'); } catch (e) {} location.reload(); };


// ======================= abas / modo =======================
$('#tabs').addEventListener('click', e => {
  const t = e.target.dataset.t; if (!t) return;
  document.querySelectorAll('#tabs button[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('main>section').forEach(s => s.classList.toggle('hidden', s.id !== 't-' + t));
  $('.modebar').classList.toggle('hidden', t === 'admin');
  window.scrollTo(0, 0);
});
function goTab(t) { document.querySelector(`#tabs button[data-t="${t}"]`).click(); }
document.querySelectorAll('.modebtn').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; renderAll(); });
function renderAll() {
  requestAnimationFrame(() => document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px'));
  document.querySelectorAll('.modebtn').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
  const L = S.db.latest || {};
  $('#hdrSub').textContent = `Carteiras: ${(S.db.config.carteiras || CORE.DEFAULT_CARTEIRAS).join(' · ')}`;
  $('#hdrMeta').innerHTML = `Base de <b>${brDate(L.date)}</b><br>${S.rows.length} kits · ${brlK(S.rows.reduce((s, o) => s + o.val, 0))} · ${S.db.history.length} atualização(ões)`;
  renderKits(); renderAnalise(); renderEvolucao(); if (!LOCAL) renderAdmin();
}

// ======================= barras =======================
function segBar(list, max) {
  max = max || 1; const by = groupBy(list, o => o.pr);
  return `<div class="track">${PR.map(([p, l]) => { const v = metric(by.get(p) || []); return v ? `<i class="c${p}" style="width:${v / max * 100}%" title="${l}: ${fmt(v)}">${v / max > (S.mode === 'v' ? .2 : .045) ? fmt(v) : ''}</i>` : ''; }).join('')}</div>`;
}
const legendHTML = () => `<div class="legend">${PR.map(([p, l]) => `<span><i style="background:${PRC[p]}"></i>${l}</span>`).join('')}</div>`;
function stackedBars(groups, attr) {
  const max = Math.max(1, ...groups.map(g => metric(g[1])));
  return `${legendHTML()}<div class="bars">${groups.map(([k, list]) =>
    `<div class="row" ${attr ? `${attr}="${esc(k)}" style="cursor:pointer"` : ''}><div class="lbl" title="${esc(k)}">${esc(k || '(vazio)')}</div>${segBar(list, max)}<div class="tot" style="white-space:nowrap">${fmt(metric(list))}</div></div>`).join('')}</div>`;
}
const sortByMetric = m => [...m.entries()].sort((a, b) => metric(b[1]) - metric(a[1]));

// ======================= KITS =======================
const MINIS = {
  atraso: ['fora do prazo', o => o.atraso], noprazo: ['no prazo', o => !o.atraso], venc7: ['vencem em 7 dias', o => !o.atraso && o.far != null && o.far <= 7],
  passivo: ['passivo', o => o.ep === 'PASSIVO'], multi: ['cliente c/ 2+ CNR', o => o.ncli > 1]
};
function filtered(ignoreCart, ignoreMini) {
  const f = S.f, q = f.q.trim().toLowerCase();
  return S.rows.filter(o =>
    (ignoreCart || f.cart === 'ALL' || o.c === f.cart) &&
    (ignoreMini || !f.mini || MINIS[f.mini][1](o)) &&
    (!f.pr.size || f.pr.has(o.pr)) &&
    (!f.st || o.stt === f.st) && (!f.seg || o.seg === f.seg) && (!f.mun || o.mun === f.mun) &&
    (!f.cell || (o.fi_ === f.cell[0] && (f.cell[1] === '*' || o.fv === f.cell[1]))) &&
    (!f.hideDone || !M.has(o.n)) &&
    (!q || [o.n, o.cli, o.pn, o.cc, o.ins, o.uc, o.mun, o.ul, o.fat, o.nc, o.c].join(' ').toLowerCase().includes(q)));
}
function renderKits() {
  const el = $('#t-kits'), carts = S.db.config.carteiras || CORE.DEFAULT_CARTEIRAS;
  const all = filtered(true, true);
  const byC = carts.map(c => [c, all.filter(o => o.c === c)]);
  const maxC = Math.max(1, ...byC.map(x => metric(x[1])));
  const base = S.f.cart === 'ALL' ? all : all.filter(o => o.c === S.f.cart);
  const tot = base.reduce((s, o) => s + o.val, 0);
  const opts = (k, sel) => [...new Set(S.rows.map(o => o[k]).filter(Boolean))].sort().map(v => `<option ${sel === v ? 'selected' : ''}>${esc(v)}</option>`).join('');
  const mini = k => { const l = base.filter(MINIS[k][1]); return `<div data-mini="${k}" class="${S.f.mini === k ? 'on' : ''}"><b style="${k === 'atraso' ? 'color:var(--r)' : k === 'venc7' ? 'color:#a07800' : ''}">${S.mode === 'v' ? brlK(metric(l)) : l.length}</b>${MINIS[k][0]}${S.mode === 'v' ? ` · ${l.length}` : ` · ${brlK(l.reduce((s, o) => s + o.val, 0))}`}</div>`; };
  el.innerHTML = `
    <div class="ov">
      <div class="panel ovall ${S.f.cart === 'ALL' ? 'on' : ''}" id="ovAll">
        <h3>${S.f.cart === 'ALL' ? 'Todas as carteiras' : esc(S.f.cart) + ' <small>clique aqui para voltar a ver todas</small>'}</h3>
        <div class="big"><b>${S.mode === 'v' ? brlK(tot) : base.length}</b><span>${S.mode === 'v' ? `em ${base.length} kits pendentes` : `kits pendentes · ${brl(tot)}`}</span></div>
        ${legendHTML()}${segBar(base, metric(base) || 1)}
        <div class="minis">${['atraso', 'noprazo', 'venc7', 'passivo', 'multi'].map(mini).join('')}
          <div style="cursor:default"><b>${new Set(base.map(cliKey)).size}</b>clientes</div></div>
      </div>
      <div class="panel"><h3>Por carteira <small>clique para filtrar</small></h3>${legendHTML()}
        ${byC.map(([c, l]) => `<div class="crow ${S.f.cart === c ? 'on' : ''}" data-c="${esc(c)}"><div class="nm">${esc(c)}<small>${owners(c) ? esc(owners(c)) + ' · ' : ''}${l.length} kits · ${brlK(l.reduce((s, o) => s + o.val, 0))}</small></div>${segBar(l, maxC)}<div class="tot" style="white-space:nowrap">${fmt(metric(l))}</div></div>`).join('')}
      </div>
    </div>
    <div class="filters">
      <input type="search" id="q" placeholder="Buscar nota, cliente, conta contrato, instalação, município…" value="${esc(S.f.q)}">
      ${PR.map(([p]) => `<button class="chip ${S.f.pr.has(p) ? 'on' : ''}" data-pr="${p}"><span class="dot" style="background:${PRC[p]}"></span>${p}</button>`).join('')}
      <select id="fSt" class="btn"><option value="">Status (BI)</option>${opts('stt', S.f.st)}</select>
      <select id="fSeg" class="btn"><option value="">Segmento</option>${opts('seg', S.f.seg)}</select>
      <select id="fMun" class="btn"><option value="">Município</option>${opts('mun', S.f.mun)}</select>
      ${S.f.mini ? `<button class="chip on" id="rmMini">${MINIS[S.f.mini][0]} ✕</button>` : ''}
      ${S.f.cell ? `<button class="chip on" id="rmCell">Matriz: ${esc(CORE.FX_IDADE.find(x => x[0] === S.f.cell[0])[1])} dias${S.f.cell[1] !== '*' ? ' × R$ ' + esc(CORE.FX_VALOR.find(x => x[0] === S.f.cell[1])[1]) : ''} ✕</button>` : ''}
      <label class="chip"><input type="checkbox" id="hideDone" ${S.f.hideDone ? 'checked' : ''}> Ocultar cobrados</label>
      <select id="grp" class="btn" title="Agrupar por">${[['pr', 'Agrupar: Prioridade'], ['c', 'Agrupar: Carteira'], ['stt', 'Agrupar: Status'], ['mun', 'Agrupar: Município'], ['seg', 'Agrupar: Segmento']].map(([k, l]) => `<option value="${k}" ${S.grp === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button class="btn" id="expAll">Expandir tudo</button><button class="btn" id="colAll">Recolher</button>
      <span class="count" id="cnt"></span>

function lineChart(series, labels, h = 240) {
  const W = 760, H = h, P = { l: 40, r: 110, t: 14, b: 30 };
  const max = Math.max(1, ...series.flatMap(s => s.v)); const n = labels.length;
  const x = i => P.l + (n === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (n - 1));
  const y = v => P.t + (H - P.t - P.b) * (1 - v / max);
  const ticks = [0, .25, .5, .75, 1].map(t => Math.round(max * t));
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:${H + 20}px">
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="#eef0f3"/><text x="${P.l - 6}" y="${y(t) + 4}" font-size="10" text-anchor="end" fill="#98a2b3">${t}</text>`).join('')}
    ${labels.map((l, i) => `<text x="${x(i)}" y="${H - 10}" font-size="10.5" text-anchor="middle" fill="#667085">${l}</text>`).join('')}
    ${series.map(s => `<polyline fill="none" stroke="${s.c}" stroke-width="${s.w || 2}" points="${s.v.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>
      ${s.v.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${s.c}"><title>${esc(s.n)} · ${labels[i]}: ${v}</title></circle>`).join('')}
`).join('')}
    ${(() => { const L = series.map(s => ({ s, y: y(s.v[n - 1]) + 4 })).sort((a, b) => a.y - b.y); for (let i = 1; i < L.length; i++) if (L[i].y - L[i - 1].y < 13) L[i].y = L[i - 1].y + 13;
      return L.map(({ s, y: yy }) => `<text x="${x(n - 1) + 8}" y="${yy}" font-size="11" fill="${s.c}" font-weight="700">${esc(s.n)} ${s.v[n - 1]}</text>`).join(''); })()}
  </svg>`;
}

    </div>
    <div class="panel"><h3>Bases carregadas</h3><table class="tb"><thead><tr><th>Data da base</th><th>Arquivo</th><th class="num">Kits</th><th class="num">Valor</th><th class="num">Fora do prazo</th></tr></thead><tbody>
      ${H.slice().reverse().map(h => `<tr><td>${brDate(h.date)}</td><td>${esc(h.file || '')}</td><td class="num">${h.items.length}</td><td class="num">${brl(h.items.reduce((s, i) => s + i[4], 0))}</td><td class="num">${h.items.filter(i => i[5]).length}</td></tr>`).join('')}</tbody></table></div>`;
}

// ======================= GITHUB / ADMIN =======================
const GH = {
  get cfg() {
    const g = (S.db && S.db.config.gh) || {}, onPages = location.hostname.endsWith('github.io');
    let tok = ''; try { tok = localStorage.getItem('ghtok') || ''; } catch (e) {}
    return { owner: g.owner || (onPages ? location.hostname.split('.')[0] : 'LCEQTL'), repo: g.repo || (onPages ? location.pathname.split('/')[1] : 'Entrega-Kits-CNR'), token: g.token || tok };
  },
  get token() { return LOCAL ? '' : this.cfg.token; },
  async api(path, opt = {}, tk) {
    const c = this.cfg; tk = tk || c.token; if (!tk) throw new Error('Nenhum token do GitHub configurado (aba Admin).');
    const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${path}`, { cache: 'no-store', ...opt, headers: { Authorization: 'Bearer ' + tk, Accept: 'application/vnd.github+json', ...(opt.headers || {}) } });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) {} const err = new Error(`GitHub ${r.status}: ${m}`); err.status = r.status; throw err; }
    return r;
  },
  async read(path, tk) {
    let meta;
    try { meta = await (await this.api(`/contents/${path}?ref=main&t=${Date.now()}`, {}, tk)).json(); } catch (e) { if (e.status === 404) return null; throw e; }
    const raw = (meta.content && meta.encoding === 'base64') ? new TextDecoder().decode(Uint8Array.from(atob(meta.content.replace(/\s/g, '')), c => c.charCodeAt(0)))
      : await (await this.api(`/contents/${path}?ref=main&t=${Date.now()}`, { headers: { Accept: 'application/vnd.github.raw' } }, tk)).text();
    return { sha: meta.sha, raw };
  },
  async write(path, text, sha, msg, tk) {
    return (await this.api(`/contents/${path}`, { method: 'PUT', body: JSON.stringify({ message: msg, content: CORE.utf8b64(text), branch: 'main', ...(sha ? { sha } : {}) }) }, tk)).json();
  }
};
async function editDB(fn, msg, tk) { // lê, decifra, altera e grava a base
  const cur = await GH.read(DB_PATH, tk); if (!cur) throw new Error('data/db.enc não encontrado');
  const db = await CORE.decrypt(cur.raw, S.pass); db.config = db.config || {}; db.history = db.history || [];
  await fn(db); await GH.write(DB_PATH, await CORE.encrypt(db, S.pass), cur.sha, msg, tk);
  loadDB(db); renderAll(); goTab('admin'); return db;
}
let XLSXlib = null;
async function loadXLSX() {
  if (XLSXlib) return XLSXlib;
  await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload = ok; s.onerror = () => ko(new Error('Não consegui carregar o leitor de Excel (SheetJS).')); document.head.appendChild(s); });
  return (XLSXlib = window.XLSX);
}
let pending = null;
function renderAdmin() {
  const c = GH.cfg, cfg = S.db.config, emb = cfg.gh && cfg.gh.token;
  $('#t-admin').innerHTML = `
  <div class="grid2">
    <div class="panel form"><h3>1 · Nova base</h3>
      <div class="drop" id="drop">Arraste aqui a <b>BASE ANALÍTICA DO ESTOQUE DE KITS (.xlsx)</b><br><span class="note">ou clique para escolher · mesmas colunas da base atual</span><input type="file" id="file" accept=".xlsx,.xls,.csv" hidden></div>
      <div id="prev"></div>
      <label>Data da base (usada para calcular os dias)</label><input type="date" id="snapDate">
      <div style="margin-top:12px"><button class="btn pri" id="pub" disabled>Publicar (commit criptografado)</button></div>
      <div class="log hidden" id="log"></div>
    </div>
    <div class="panel form"><h3>2 · Acesso ao GitHub</h3>
      <p class="note" style="margin:0">${c.token ? `✓ Token configurado (…${esc(c.token.slice(-4))})${emb ? ', guardado na base criptografada: <b>quem tem a palavra-chave publica e marca cobranças sem colar token</b>.' : ', só neste navegador.'}` : '<b style="color:#b42318">Nenhum token configurado.</b>'}</p>
      <label>Usuário / organização</label><input type="text" id="ghOwner" value="${esc(c.owner)}">
      <label>Repositório</label><input type="text" id="ghRepo" value="${esc(c.repo)}">
      <label>Token novo (fine-grained, só este repo, <i>Contents: Read and write</i>)</label><input type="password" id="ghTok" placeholder="github_pat_… (vazio = manter o atual)" autocomplete="off">
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="ghSave">Gravar na base (criptografado)</button><button class="btn" id="ghTest">Testar acesso</button></div>
    </div>
  </div>
  <div class="grid2">
    <div class="panel form"><h3>3 · Carteiras e donos</h3>
      <label>Carteiras filtradas (uma por linha · coluna “Carteira Atual”)</label><textarea id="cfgCarts">${esc((cfg.carteiras || CORE.DEFAULT_CARTEIRAS).join('\n'))}</textarea>
      <label>Nome do responsável por carteira (opcional · <code>CARTEIRA = Nome</code>)</label>
      <textarea id="cfgDonos" placeholder="S R NONATO = Fulano">${esc(Object.entries(cfg.donos || {}).map(([k, v]) => k + ' = ' + v).join('\n'))}</textarea>
      <div style="margin-top:10px"><button class="btn pri" id="cfgSave">Salvar configuração (commit)</button></div>
    </div>
    <div class="panel form"><h3>4 · Manutenção</h3>
      <label>Bases no histórico</label>
      <div>${[...S.db.history].sort((a, b) => b.date.localeCompare(a.date)).map(h => `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)"><span>${brDate(h.date)} · ${h.items.length} kits <span class="note">${esc(h.file || '')}</span></span><button class="btn" data-del="${h.date}">Remover</button></div>`).join('')}</div>
      <label style="margin-top:16px">Trocar palavra-chave</label>
      <input type="password" id="np1" placeholder="Nova palavra-chave"><input type="password" id="np2" placeholder="Repita" style="margin-top:6px">
      <div style="margin-top:10px"><button class="btn" id="chPass">Trocar e recriptografar</button></div>
    </div>
  </div>`;
  const log = m => { const l = $('#log'); l.classList.remove('hidden'); l.textContent += m + '\n'; l.scrollTop = 1e9; };
  $('#ghSave').onclick = async () => {
    const tk = $('#ghTok').value.trim() || GH.token, owner = $('#ghOwner').value.trim(), repo = $('#ghRepo').value.trim();
    try { await editDB(db => { db.config.gh = { owner, repo, token: tk }; }, 'Configuração de acesso', tk); toast('Token gravado na base'); } catch (e) { toast(e.message); }
  };
  $('#ghTest').onclick = async () => { try { const r = await (await GH.api('', {}, $('#ghTok').value.trim() || GH.token)).json(); toast('OK: ' + r.full_name + (r.permissions && r.permissions.push ? ' (pode gravar)' : ' (sem permissão de gravação!)')); } catch (e) { toast(e.message); } };
  const drop = $('#drop'), file = $('#file');
  drop.onclick = () => file.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
  file.onchange = () => file.files[0] && handleFile(file.files[0]);
  async function handleFile(f) {
    $('#prev').innerHTML = '<p class="note">Lendo…</p>';
    try {
      const X = await loadXLSX(); const res = CORE.sheetToRows(X, await f.arrayBuffer());
      $('#snapDate').value = res.dataBase || CORE.guessDateFromName(f.name, new Date().getFullYear()) || new Date().toISOString().slice(0, 10);
      pending = { file: f.name, res }; preview();
    } catch (e) { $('#prev').innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
  }
  function preview() {
    if (!pending) return;
    const carts = $('#cfgCarts').value.split('\n').map(s => s.trim()).filter(Boolean);
    const list = CORE.processRows(pending.res.rows, carts, $('#snapDate').value); pending.list = list; pending.carts = carts;
    $('#prev').innerHTML = `${pending.res.missing.length ? `<div class="warn">Colunas não encontradas: ${pending.res.missing.map(esc).join(', ')}</div>` : ''}
      <p style="margin:10px 0 4px"><b>${esc(pending.file)}</b> · ${pending.res.rows.length} linhas → <b>${list.length}</b> kits das suas carteiras · ${brl(list.reduce((s, o) => s + o.val, 0))}</p>
      <p class="note">${[...groupBy(list, o => o.c).entries()].map(([k, v]) => `${esc(k)}: ${v.length}`).join(' · ')}${pending.res.dataBase ? ' · data da base lida da coluna “Data Entrega”' : ''}</p>`;
    $('#pub').disabled = !list.length;
  }
  $('#snapDate').onchange = preview;
  $('#pub').onclick = async () => {
    if (!pending?.list?.length) return; const b = $('#pub'); b.disabled = true; $('#log').textContent = '';
    try {
      const date = $('#snapDate').value; if (!date) throw new Error('Informe a data da base.');
      log('Lendo, criptografando e enviando…');
      await editDB(db => {
        db.config.carteiras = pending.carts;
        db.latest = { date, file: pending.file, uploaded: new Date().toISOString(), rows: pending.list };
        db.history = db.history.filter(h => h.date !== date); db.history.push(CORE.historyEntry(pending.list, date, pending.file));
        db.history.sort((a, b) => a.date.localeCompare(b.date));
      }, `Base ${brDate(date)} · ${pending.list.length} kits`);
      pending = null; toast('Base publicada · o site atualiza em ~1 min');
    } catch (e) { log('✖ ' + e.message); b.disabled = false; }
  };
  $('#cfgSave').onclick = async () => {
    try {
      await editDB(db => {
        db.config.carteiras = $('#cfgCarts').value.split('\n').map(s => s.trim()).filter(Boolean);
        db.config.donos = Object.fromEntries($('#cfgDonos').value.split('\n').map(l => l.split('=')).filter(p => p.length >= 2 && p[0].trim()).map(p => [p[0].trim(), p.slice(1).join('=').trim()]));
      }, 'Configuração de carteiras'); toast('Configuração salva');
    } catch (e) { toast(e.message); }
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Remover a base de ' + brDate(b.dataset.del) + ' do histórico?')) return;
    try { await editDB(db => { db.history = db.history.filter(h => h.date !== b.dataset.del); }, 'Remove base ' + b.dataset.del); toast('Removida'); } catch (e) { toast(e.message); }
  });
  $('#chPass').onclick = async () => {
    const a = $('#np1').value, b2 = $('#np2').value;
    if (a.length < 6) return toast('Use pelo menos 6 caracteres'); if (a !== b2) return toast('As palavras-chave não conferem');
    try {
      const cur = await GH.read(DB_PATH), db = await CORE.decrypt(cur.raw, S.pass), mk = await GH.read(MARKS_PATH);
      const marks = mk ? await CORE.decrypt(mk.raw, S.pass) : null;
      await GH.write(DB_PATH, await CORE.encrypt(db, a), cur.sha, 'Troca de palavra-chave');
      if (mk) await GH.write(MARKS_PATH, await CORE.encrypt(marks, a), mk.sha, 'Troca de palavra-chave (marcações)');
      S.pass = a; try { sessionStorage.setItem('k', a); } catch (e) {} toast('Palavra-chave trocada');
    } catch (e) { toast(e.message); }
  };
}

if (LOCAL) {
  loadDB(LOCAL); $('#tabAdmin').classList.add('hidden'); $('#logout').classList.add('hidden');
  $('#localBadge').innerHTML = '<span class="localbadge">VERSÃO LOCAL</span>';
  start();
} else (async () => { let k = null; try { k = sessionStorage.getItem('k'); } catch (e) {} if (k) { try { await login(k); } catch (e) {} } })();
</script>
